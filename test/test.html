<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>
  <body>
 <section class="main-area">
      <div class="result">
        <h3 class="text-3xl font-bold underline bg-red-300">Your Result</h3>
        <div id="circle">
          <h1>76</h1>
          <p>of 100</p>
        </div>
        <div id="main-foot">
          <h2>Great</h2>
          <p>
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>
      </div>
    </section>

    <sectiton class="summary">
      <h3>Summary</h3>
      <div class="summary-cards">
        <div id="reaction">
          <div id="left">
            <img src="" alt="thunder icon" />
            <p id="red">Reaction</p>
          </div>
          <div id="right">
            <p><em>80</em>/100</p>
          </div>
        </div>

        <div id="memory">
          <div id="left">
            <img src="" alt="brain icon" />
            <p id="yellow">Memory</p>
          </div>
          <div id="right">
            <p><em>92</em>/100</p>
          </div>
        </div>

        <div id="verbal">
          <div id="left">
            <img src="" alt="speach bubble icon" />
            <p id="red">Verbal</p>
          </div>
          <div id="right">
            <p><em>61</em>/100</p>
          </div>
        </div>

        <div id="visual">
          <div id="left">
            <img src="" alt="eye icon" />
            <p id="red">Visual</p>
          </div>
          <div id="right">
            <p><em>73</em>/100</p>
          </div>
        </div>
      </div>

      <div class="btn">
        <button>Continue</button>
      </div>
    </sectiton>
  </body>
</html>
